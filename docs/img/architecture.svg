<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5a6773"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a6420"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #c5cdd5; stroke-width: 1; }
      .eng { fill: #e8eef5; stroke: #23476b; stroke-width: 1; }
      .hum { fill: #f4eee2; stroke: #8a6420; stroke-width: 1; }
      .ext { fill: #ffffff; stroke: #5a6773; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .band { fill: none; stroke: #dde2e7; stroke-width: 1; }
      .t { font-size: 14px; font-weight: 600; fill: #0f1b26; }
      .s { font-size: 11.5px; fill: #5a6773; }
      .l { font-size: 12px; font-weight: 600; fill: #5a6773; }
      .note { font-size: 11.5px; fill: #8a6420; font-weight: 600; }
      .ln { stroke: #5a6773; stroke-width: 1.3; fill: none; }
      .lh { stroke: #8a6420; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>

  <!-- client -->
  <rect class="box" x="40" y="16" width="430" height="56" rx="6"/>
  <text class="t" x="58" y="40">Web UI</text><text class="s" x="58" y="58">chat next to the client file; every figure links to its source</text>
  <rect class="box" x="530" y="16" width="430" height="56" rx="6"/>
  <text class="t" x="548" y="40">Advice Report</text><text class="s" x="548" y="58">suitability record with a SHA-256 fingerprint</text>
  <path class="ln" d="M255 72V104" marker-end="url(#a)"/>
  <path class="ln" d="M745 72V104" marker-end="url(#a)"/>

  <!-- server -->
  <rect class="box" x="40" y="106" width="920" height="50" rx="6"/>
  <text class="t" x="58" y="129">FastAPI server</text><text class="s" x="58" y="146">JSON API, CSP and security headers, bounded sessions, per-IP limits</text>

  <!-- advisory core -->
  <rect class="band" x="40" y="186" width="600" height="176" rx="8"/>
  <text class="l" x="624" y="206" text-anchor="end">Advisory core (AdvisorSession)</text>
  <path class="ln" d="M145 156V214" marker-end="url(#a)"/>
  <rect class="box" x="60" y="216" width="170" height="58" rx="6"/>
  <text class="t" x="74" y="240">Input guard</text><text class="s" x="74" y="258">PII redaction, injection</text>
  <path class="ln" d="M230 245H258" marker-end="url(#a)"/>
  <rect class="box" x="260" y="216" width="170" height="58" rx="6"/>
  <text class="t" x="274" y="240">Agent loop</text><text class="s" x="274" y="258">stage-aware tools, ≤ 8 steps</text>
  <path class="ln" d="M432 238H678" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="s" x="470" y="230">messages and tool requests</text>
  <path class="ln" d="M300 274L190 292" marker-end="url(#a)"/>
  <rect class="box" x="60" y="292" width="170" height="58" rx="6"/>
  <text class="t" x="74" y="316">Output guard</text><text class="s" x="74" y="334">grounded numbers, no promises</text>
  <path class="ln" d="M345 274V290" marker-end="url(#a)"/>
  <rect class="box" x="260" y="292" width="170" height="58" rx="6"/>
  <text class="t" x="274" y="316">Tool dispatcher</text><text class="s" x="274" y="334">validated arguments only</text>

  <!-- model -->
  <rect class="ext" x="680" y="200" width="260" height="76" rx="6"/>
  <text class="t" x="698" y="224">Language model (untrusted)</text>
  <text class="s" x="698" y="242">Groq gpt-oss-120b with fallbacks</text>
  <text class="s" x="698" y="260">Prompt Guard 2 injection scoring</text>
  <text class="note" x="680" y="300">The model has no tool that can</text>
  <text class="note" x="680" y="316">place, confirm or authorise an order.</text>

  <!-- engine -->
  <path class="ln" d="M345 350V398" marker-end="url(#a)"/>
  <rect class="band" x="40" y="400" width="600" height="160" rx="8"/>
  <text class="l" x="56" y="420">Deterministic engine: the source of every number</text>
  <g>
    <rect class="eng" x="56" y="434" width="106" height="52" rx="6"/><text class="t" x="68" y="456">profiling</text><text class="s" x="68" y="474">C1–C5</text>
    <rect class="eng" x="172" y="434" width="106" height="52" rx="6"/><text class="t" x="184" y="456">catalog</text><text class="s" x="184" y="474">R1–R5 funds</text>
    <rect class="eng" x="288" y="434" width="106" height="52" rx="6"/><text class="t" x="300" y="456">allocation</text><text class="s" x="300" y="474">weights, caps</text>
    <rect class="eng" x="404" y="434" width="106" height="52" rx="6"/><text class="t" x="416" y="456">stress</text><text class="s" x="416" y="474">history</text>
    <rect class="eng" x="520" y="434" width="106" height="52" rx="6"/><text class="t" x="532" y="456">goals</text><text class="s" x="532" y="474">Monte Carlo</text>
  </g>
  <text class="s" x="56" y="512">Unit-tested Python. The risk class is read from the stored profile,</text>
  <text class="s" x="56" y="530">never from model arguments; a product above the client's class</text>
  <text class="s" x="56" y="548">cannot be recommended.</text>

  <!-- human path -->
  <path class="lh" d="M975 156V398" marker-end="url(#b)"/>
  <text class="note" transform="translate(990 388) rotate(-90)">signed disclosure + hold-to-confirm token</text>
  <rect class="band" x="680" y="400" width="280" height="160" rx="8"/>
  <text class="l" x="696" y="420">Client actions only</text>
  <rect class="hum" x="696" y="432" width="248" height="36" rx="6"/><text class="t" x="708" y="455">permissions</text><text class="s" x="800" y="455">tiers, one-time tokens</text>
  <rect class="hum" x="696" y="474" width="248" height="36" rx="6"/><text class="t" x="708" y="497">account</text><text class="s" x="800" y="497">executes only with a token</text>
  <rect class="hum" x="696" y="516" width="248" height="36" rx="6"/><text class="t" x="708" y="539">rehearsal</text><text class="s" x="800" y="539">revealed tolerance</text>

  <!-- evidence -->
  <path class="ln" d="M340 560V598" marker-end="url(#a)"/>
  <path class="ln" d="M700 560L622 598" marker-end="url(#a)"/>
  <rect class="box" x="40" y="600" width="600" height="64" rx="6"/>
  <text class="t" x="58" y="626">Audit log: SHA-256 hash chain</text>
  <text class="s" x="58" y="646">every guard decision, model call, tool call, consent, order and report</text>
  <path class="ln" d="M640 632H678" marker-end="url(#a)"/>
  <rect class="hum" x="680" y="600" width="280" height="64" rx="6"/>
  <text class="t" x="698" y="626">AuditAnchor.sol</text>
  <text class="s" x="698" y="646">chain head on FISCO BCOS (WeBank)</text>
</svg>
