[project]
name = "wealth-advisor"
version = "0.1.0"
description = "Compliant, explainable wealth-advisory AI agent (FinTechathon 2026, Topic B)"
readme = "README.md"
authors = [
    { name = "Rockfella", email = "erkinovvvelyor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "openai>=3.28.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
wealth-advisor = "wealth_advisor.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
